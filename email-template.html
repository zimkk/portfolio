<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #000000 0%, #333333 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 30px;
        }
        .message-box {
            background-color: #f8f9fa;
            border-left: 4px solid #000000;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .message-box h3 {
            margin: 0 0 15px 0;
            color: #000000;
            font-size: 18px;
        }
        .contact-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .contact-info h3 {
            margin: 0 0 15px 0;
            color: #000000;
            font-size: 16px;
        }
        .info-row {
            display: flex;
            margin-bottom: 10px;
        }
        .info-label {
            font-weight: 600;
            color: #555;
            min-width: 80px;
        }
        .info-value {
            color: #333;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        .footer p {
            margin: 0;
            color: #666;
            font-size: 12px;
        }
        .timestamp {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }
        @media only screen and (max-width: 600px) {
            .container {
                margin: 10px;
                border-radius: 4px;
            }
            .header, .content, .footer {
                padding: 20px;
            }
            .info-row {
                flex-direction: column;
            }
            .info-label {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Contact Form Submission</h1>
            <p>Portfolio Website - Hassan Nazir</p>
        </div>
        
        <div class="content">
            <div class="contact-info">
                <h3>Contact Information</h3>
                <div class="info-row">
                    <span class="info-label">Name:</span>
                    <span class="info-value">{{from_name}}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value">{{from_email}}</span>
                </div>
            </div>
            
            <div class="message-box">
                <h3>Message</h3>
                <p style="margin: 0; white-space: pre-wrap;">{{message}}</p>
            </div>
            
            <div class="timestamp">
                Sent on {{sent_date}} at {{sent_time}}
            </div>
        </div>
        
        <div class="footer">
            <p>This message was sent from your portfolio contact form.</p>
            <p>© 2024 Hassan Nazir - AI & Automation Engineer</p>
        </div>
    </div>
</body>
</html>
