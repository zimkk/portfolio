    <text x="35" y="176" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="12">https://ai-gateway.vercel.sh/v1</text>

    <!-- Step 3 -->
    <rect x="20" y="205" width="345" height="54" rx="8" fill="#141720" stroke="rgba(217,222,232,0.12)"/>
    <text x="35" y="228" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STEP 3: MODEL TARGET</text>
    <text x="35" y="246" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="12">model: "stealth/pixel-canary"</text>

    <!-- Step 4 -->
    <rect x="20" y="275" width="345" height="54" rx="8" fill="#141720" stroke="rgba(217,222,232,0.12)"/>
    <text x="35" y="298" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STEP 4: PROTOCOL</text>
    <text x="35" y="316" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="12">AI SDK 7 streamText / Chat API</text>

