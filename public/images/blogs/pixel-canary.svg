    <text x="370" y="155" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="44" font-weight="700">96.8%</text>
    <text x="370" y="195" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13">30 / 31 tasks · ties top score</text>

