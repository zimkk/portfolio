    <rect x="20" y="350" width="345" height="140" rx="8" fill="#0f1c13" stroke="rgba(16,185,129,0.35)" stroke-width="1.2"/>
    <text x="35" y="378" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">OPTIMIZATION: AGENTS.MD</text>
    <text x="35" y="405" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12">→ node_modules/next/dist/docs/</text>
