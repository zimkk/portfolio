    <text x="45" y="325" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="13">Context Window</text>
    <text x="260" y="325" fill="#ff785d" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">262,144 tokens (262K)</text>

    <text x="45" y="365" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="13">Max Output</text>
    <text x="260" y="365" fill="#ff785d" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">131,072 tokens (131K)</text>

