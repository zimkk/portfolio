    <text x="45" y="155" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="44" font-weight="700">90.3%</text>
    <text x="45" y="195" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="13">28 / 31 tasks</text>

    <!-- With AGENTS.md Card -->
    <rect x="350" y="65" width="295" height="155" rx="10" fill="#141720" stroke="rgba(16,185,129,0.45)" stroke-width="1.2"/>
