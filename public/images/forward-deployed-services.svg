<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d3d"/>
      <stop offset="100%" stop-color="#ff8159"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#d9dee8" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Top Status Bar -->
  <rect x="50" y="40" width="1100" height="48" rx="10" fill="#111319" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="78" cy="64" r="5" fill="#ff5d3d"/>
  <circle cx="96" cy="64" r="5" fill="#eab308"/>
  <circle cx="114" cy="64" r="5" fill="#10b981"/>
  
  <text x="140" y="69" fill="#aab3c2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500">fde-core-runtime // live-cluster: prod-us-east-1 // status: 99.98% uptime</text>
  <text x="1020" y="69" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">CANARY: 100%</text>

  <!-- Left Main Card: Architecture Pipeline & Invariant Stream -->
  <rect x="50" y="110" width="680" height="515" rx="14" fill="#111319" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <text x="80" y="150" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="20" font-weight="700">Forward Deployed Engineering Operating Mesh</text>
  <text x="80" y="175" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="12">Autonomous Invariant Verification &amp; Shadow Traffic Reconciliation</text>

  <!-- Flow Nodes inside Left Card -->
  <!-- Node 1 -->
  <g transform="translate(80, 210)">
    <rect width="170" height="90" rx="10" fill="#08090c" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="15" y="30" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">01. INGESTION</text>
    <text x="15" y="52" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="13" font-weight="600">Transactional Outbox</text>
    <text x="15" y="72" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="11">Dual-write stream</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 250 255 L 290 255" stroke="#ff5d3d" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="290,251 298,255 290,259" fill="#ff5d3d"/>

  <!-- Node 2 -->
  <g transform="translate(300, 210)">
    <rect width="180" height="90" rx="10" fill="#08090c" stroke="#ff5d3d" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="15" y="30" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">02. FDE SIDECAR</text>
    <text x="15" y="52" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="13" font-weight="600">Constrained AI Agent</text>
    <text x="15" y="72" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">0 locks held (Isolated)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 480 255 L 520 255" stroke="#ff5d3d" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="520,251 528,255 520,259" fill="#ff5d3d"/>

  <!-- Node 3 -->
  <g transform="translate(530, 210)">
    <rect width="170" height="90" rx="10" fill="#08090c" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <text x="15" y="30" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">03. INVARIANT GATE</text>
    <text x="15" y="52" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="13" font-weight="600">Deterministic Audit</text>
    <text x="15" y="72" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="11">100% policy pass</text>
  </g>

  <!-- Terminal Output Block -->
  <rect x="80" y="330" width="620" height="265" rx="10" fill="#08090c" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="100" y="360" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="11">$ fde-telemetry-cli audit --session=enterprise-canary</text>
  <text x="100" y="388" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">✓ 40,000 production transactions mirrored in shadow mode</text>
  <text x="100" y="416" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">✓ Zero relational deadlocks detected across legacy PostgreSQL</text>
  <text x="100" y="444" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">✓ Numeric drift tolerance: 0.000000% (Mathematical match)</text>
  <text x="100" y="472" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="12">[METRIC] Operator review speed: 18m → 1.8m (10x acceleration)</text>
  <text x="100" y="500" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="12">[CANARY] DNS switchover initiated: 100% traffic live</text>
  <text x="100" y="535" fill="#aab3c2" font-family="'JetBrains Mono', monospace" font-size="11">> Ready for multi-tenant regional expansion.</text>
  <line x1="100" y1="565" x2="350" y2="565" stroke="#ff5d3d" stroke-width="2"/>

  <!-- Right Cards: Production Telemetry Metrics -->
  <g transform="translate(755, 110)">
    <!-- Metric 1 -->
    <rect width="395" height="155" rx="14" fill="#111319" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="30" y="42" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="12" uppercase="true">TIME-TO-PRODUCTION (PILOT RESCUE)</text>
    <text x="30" y="90" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="36" font-weight="700">14 Days</text>
    <text x="30" y="125" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">↓ Slashed from 6-month consulting backlog</text>
  </g>

  <g transform="translate(755, 290)">
    <!-- Metric 2 -->
    <rect width="395" height="155" rx="14" fill="#111319" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="30" y="42" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="12" uppercase="true">DETERMINISTIC ACCURACY</text>
    <text x="30" y="90" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="36" font-weight="700">99.4%</text>
    <text x="30" y="125" fill="#ff5d3d" font-family="'JetBrains Mono', monospace" font-size="12">↑ Guarded by AST Invariant Checkpoints</text>
  </g>

  <g transform="translate(755, 470)">
    <!-- Metric 3 -->
    <rect width="395" height="155" rx="14" fill="#111319" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="30" y="42" fill="#7f8794" font-family="'JetBrains Mono', monospace" font-size="12" uppercase="true">AIR-GAPPED COMPLIANCE</text>
    <text x="30" y="90" fill="#ffffff" font-family="'Satoshi', sans-serif" font-size="36" font-weight="700">100% Local</text>
    <text x="30" y="125" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">✓ Zero external data egress (ITAR / HIPAA)</text>
  </g>
</svg>
