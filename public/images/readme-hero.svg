<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0d0f15"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="accent-coral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5d3d"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="120" r="180" fill="#ff5d3d" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="360" r="220" fill="#00f2fe" opacity="0.06" filter="url(#glow)" />

  <!-- Top Brand Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-coral)"/>

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="168" height="28" rx="6" fill="rgba(255, 93, 61, 0.12)" stroke="rgba(255, 93, 61, 0.3)" stroke-width="1"/>
    <text x="12" y="18" fill="#ff5d3d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FORWARD DEPLOYED AI</text>

    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Hassan Nazir — Architecture &amp; Engineering Mesh</text>
    <text x="0" y="100" fill="#8e96a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Enterprise Forward Deployed Engineering, Autonomous AI Agents, RAG Pipelines &amp; MDX Field Guides</text>
  </g>

  <!-- 4 Interactive Architectural Nodes -->
  <g transform="translate(60, 190)">
    <!-- Node 1: FDE & Systems -->
    <rect x="0" y="0" width="255" height="230" rx="12" fill="rgba(18, 21, 29, 0.75)" stroke="rgba(255, 93, 61, 0.35)" stroke-width="1.2"/>
    <rect x="18" y="18" width="36" height="36" rx="8" fill="rgba(255, 93, 61, 0.15)"/>
    <path d="M 30 36 L 42 36 M 36 30 L 36 42" stroke="#ff5d3d" stroke-width="2" stroke-linecap="round"/>
    <text x="64" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Forward Deployed</text>
    <text x="64" y="50" fill="#ff5d3d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">MISSION CRITICAL</text>
    <text x="18" y="85" fill="#8e96a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" line-height="1.4">
      <tspan x="18" dy="0">Embedded pilot rescues,</tspan>
      <tspan x="18" dy="18">air-gapped clusters, legacy</tspan>
      <tspan x="18" dy="18">sidecars &amp; zero-downtime</tspan>
      <tspan x="18" dy="18">database migrations.</tspan>
    </text>
    <rect x="18" y="175" width="219" height="34" rx="6" fill="#08090c" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="28" y="196" fill="#4facfe" font-family="'JetBrains Mono', monospace" font-size="11">&gt; status: 100% SLA verify</text>

    <!-- Node 2: MDX & KaTeX -->
    <rect x="275" y="0" width="255" height="230" rx="12" fill="rgba(18, 21, 29, 0.75)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.2"/>
    <rect x="293" y="18" width="36" height="36" rx="8" fill="rgba(0, 242, 254, 0.15)"/>
    <text x="304" y="42" fill="#00f2fe" font-family="serif" font-size="18" font-weight="700">∑</text>
    <text x="339" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">MDX + KaTeX Math</text>
    <text x="339" y="50" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">40 FIELD GUIDES</text>
    <text x="293" y="85" fill="#8e96a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
      <tspan x="293" dy="0">File-based dynamic blog</tspan>
      <tspan x="293" dy="18">engine, LaTeX typesetting,</tspan>
      <tspan x="293" dy="18">rehype syntax highlights &amp;</tspan>
      <tspan x="293" dy="18">GitHub callout alerts.</tspan>
    </text>
    <rect x="293" y="175" width="219" height="34" rx="6" fill="#08090c" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="303" y="196" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">&gt; T_total = O(k log N)</text>

    <!-- Node 3: Dual Commenting -->
    <rect x="550" y="0" width="255" height="230" rx="12" fill="rgba(18, 21, 29, 0.75)" stroke="rgba(121, 40, 202, 0.45)" stroke-width="1.2"/>
    <rect x="568" y="18" width="36" height="36" rx="8" fill="rgba(121, 40, 202, 0.2)"/>
    <circle cx="586" cy="36" r="6" stroke="#ff0080" stroke-width="2" fill="none"/>
    <text x="614" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Dual-Mode Suite</text>
    <text x="614" y="50" fill="#ff0080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">DIRECT + GISCUS</text>
    <text x="568" y="85" fill="#8e96a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
      <tspan x="568" dy="0">Instant anonymous guest</tspan>
      <tspan x="568" dy="18">stream + GitHub Discussions</tspan>
      <tspan x="568" dy="18">sync for developers without</tspan>
      <tspan x="568" dy="18">forced barriers.</tspan>
    </text>
    <rect x="568" y="175" width="219" height="34" rx="6" fill="#08090c" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="578" y="196" fill="#ff0080" font-family="'JetBrains Mono', monospace" font-size="11">&gt; giscus.sync(GitHub)</text>

    <!-- Node 4: SEO & AEO -->
    <rect x="825" y="0" width="255" height="230" rx="12" fill="rgba(18, 21, 29, 0.75)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2"/>
    <rect x="843" y="18" width="36" height="36" rx="8" fill="rgba(52, 211, 153, 0.15)"/>
    <path d="M 855 36 L 861 42 L 871 30" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="889" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">SEO &amp; AEO Engine</text>
    <text x="889" y="50" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">48 ROUTE SHELLS</text>
    <text x="843" y="85" fill="#8e96a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
      <tspan x="843" dy="0">Pre-rendered HTML shells,</tspan>
      <tspan x="843" dy="18">llms.txt AI manifests,</tspan>
      <tspan x="843" dy="18">RSS 2.0 / Atom / JSON Feeds</tspan>
      <tspan x="843" dy="18">&amp; full JSON-LD graphs.</tspan>
    </text>
    <rect x="843" y="175" width="219" height="34" rx="6" fill="#08090c" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="853" y="196" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">&gt; 48 shells: 100/100 SEO</text>
  </g>
</svg>
