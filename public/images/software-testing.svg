    <text x="50" y="330" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="11">✓ [chromium] › e2e/sse-streaming.spec.ts:28 › Disconnect GPU cancel token (88ms)</text>
    <text x="50" y="355" fill="#d9dee8" font-family="'JetBrains Mono', monospace" font-size="11">✓ [firefox] › api/auth-session.spec.ts:45 › Token refresh race condition (64ms)</text>
